syntax = "proto3";

package grpc;

option go_package = "./proto";

service Auction{
    rpc Bid(bid) returns (ack){};
    rpc Result(empty) returns (highestBid){};
    rpc Replicate(replicate) returns (replicateAck){};
    rpc Election(empty) returns (election){};
    rpc ServerNotResponding(empty) returns (election){};
}

message bid{
    string Name = 1;
    int64 Amount = 2;
}

message ack{
    string Outcome = 1;
}

message highestBid{
    string Name = 1;
    int64 Amount = 2;
    string Status = 3; //maybe not neccesary, but just status if the auction is over or not
}

message replicate{
    string Name = 1;
    int64 Amount = 2;
}

message replicateAck{
    int64 Id = 1;
    int64 Amount = 2;
    string Outcome = 3;
}

message election{
    int64 Id = 1;
    bool isLeader = 2;
}


message empty{}